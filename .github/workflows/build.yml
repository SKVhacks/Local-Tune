# Builds LocalTune on every push, and on demand from the Actions tab
# ("Run workflow"). The APKs are attached to the run as "LocalTune-apks":
# open the run, scroll to Artifacts, download, unzip and install.
#
# Publishing a GitHub Release (any tag name) builds the app and attaches the
# APKs to it. To add them to a release made earlier, use "Run workflow" and
# type that release's tag.
name: Build LocalTune

on:
  push:
    branches: ["**"]
    # Text-only changes don't need an app build.
    paths-ignore: ["**.md", "docs/**", "*.png", "*.jpg"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APKs to this existing release (its tag, e.g. LocalTune-1.0). Leave empty for a plain build."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest

      # The signing key, from the repository's secrets: with it every build
      # updates the installed app in place. Without it the APKs are signed
      # with this run's throwaway key, which installs but can't update.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCALTUNE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LOCALTUNE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APKs
        env:
          LOCALTUNE_KEYSTORE_PASSWORD: ${{ secrets.LOCALTUNE_KEYSTORE_PASSWORD }}
          LOCALTUNE_KEY_ALIAS: ${{ secrets.LOCALTUNE_KEY_ALIAS }}
          LOCALTUNE_KEY_PASSWORD: ${{ secrets.LOCALTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APKs
        run: |
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do mv "$f" "LocalTune-${f#app-}"; done
          for f in LocalTune-*-release.apk; do mv "$f" "${f%-release.apk}.apk"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: LocalTune-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Attach to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
