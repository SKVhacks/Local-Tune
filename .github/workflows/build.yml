# Builds both LocalTune apps on every push, and on demand from the Actions tab ("Run workflow").
#
#   Android (android/)  -> "LocalTune-android": the APKs
#   Windows (windows/)  -> "LocalTune-windows": LocalTune-Setup-x64.exe (installer),
#                          LocalTune-x64.exe (one file, runs without installing)
#                          and LocalTune-windows-x64.zip
#
# Open the run, scroll to Artifacts and download. Publishing a GitHub Release (any tag name)
# builds both and attaches everything to it. To add them to a release made earlier, use
# "Run workflow" and type that release's tag.
name: Build LocalTune

on:
  push:
    branches: ["**"]
    # Text-only changes don't need a build.
    paths-ignore: ["**.md", "docs/**", "*.png", "*.jpg"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release (its tag, e.g. LocalTune-1.0). Leave empty for a plain build."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest

      # The signing key, from the repository's secrets: with it every build updates the
      # installed app in place. Without it the APKs are signed with this run's throwaway
      # key, which installs but can't update.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCALTUNE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LOCALTUNE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APKs
        env:
          LOCALTUNE_KEYSTORE_PASSWORD: ${{ secrets.LOCALTUNE_KEYSTORE_PASSWORD }}
          LOCALTUNE_KEY_ALIAS: ${{ secrets.LOCALTUNE_KEY_ALIAS }}
          LOCALTUNE_KEY_PASSWORD: ${{ secrets.LOCALTUNE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APKs
        run: |
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do mv "$f" "LocalTune-${f#app-}"; done
          for f in LocalTune-*-release.apk; do mv "$f" "${f%-release.apk}.apk"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: LocalTune-android
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet publish windows/LocalTune/LocalTune.csproj -c Release -p:Platform=x64

      - name: Installer and zip
        shell: pwsh
        run: |
          $version = ([xml](Get-Content windows/LocalTune/LocalTune.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\installer\LocalTune.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path windows\LocalTune\bin\x64\Release\net10.0-windows10.0.26100.0\win-x64\publish\* -DestinationPath windows\installer\Output\LocalTune-windows-x64.zip

      # The same app as one .exe that runs without installing (it unpacks itself on first start).
      - name: Single exe
        shell: pwsh
        run: |
          dotnet publish windows/LocalTune/LocalTune.csproj -c Release -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -o windows\installer\single
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows\installer\single\LocalTune.exe windows\installer\Output\LocalTune-x64.exe
          Get-ChildItem windows\installer\Output

      - uses: actions/upload-artifact@v4
        with:
          name: LocalTune-windows
          path: windows/installer/Output/*

      - name: Attach to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: windows/installer/Output/*
          fail_on_unmatched_files: true
